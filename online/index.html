<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bridge-island in your browser</title>
<style>
:root{--bg:#f5f7fb;--fg:#1b1f24;--brand:#4338ca}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#e6edf3;--brand:#a5b4fc}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.strip{background:#1e1b4b;color:#fff;padding:.4rem 1rem;display:flex;flex-wrap:wrap;gap:.2rem 1rem;align-items:baseline;font-size:.85rem}
.strip a{color:#c7d2fe}.strip .grow{margin-left:auto}
.stage{position:relative;flex:1;min-height:0}
iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
#veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:rgba(245,247,251,.9);text-align:center;padding:1rem}
@media (prefers-color-scheme:dark){#veil{background:rgba(11,16,32,.9)}}
.spin{width:2.4rem;height:2.4rem;border:4px solid rgba(67,56,202,.25);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="strip" role="note">
  <span>Running entirely in your browser. Nothing you enter is uploaded.</span>
  <span id="status" aria-live="polite"></span>
  <a class="grow" href="../">Documentation</a>
  <a href="https://github.com/tkaiagent123/bridge-island">Source</a>
</div>
<div class="stage">
  <iframe id="frame" title="bridge-island app"></iframe>
  <div id="veil" role="status"><div class="spin" aria-hidden="true"></div>
    <p id="veil-text">Starting Python in your browser. The first visit downloads about 10 MB; later visits are faster.</p></div>
</div>
<noscript><p style="padding:1rem">This page needs JavaScript. You can also run bridge-island on your own computer: see the documentation.</p></noscript>
<script src="app.js"></script>
</body>
</html>
