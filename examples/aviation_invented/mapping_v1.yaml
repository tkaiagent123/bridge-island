# Mapping spec for the invented GHAV baseline interface, version 1.
# Compiled to examples/aviation_invented/generated/mapping_v1.py by `bridge-island codegen`.
name: ghav_v1
baseline_version: 1
world: world.py

downlinks:
  # PlanningDisplay: metric units, publish/subscribe
  - {from: NavigationState.latitude, to: PlanningDisplay.nav_lat_deg, transforms: [{valid_range: [-90, 90]}]}
  - {from: NavigationState.longitude, to: PlanningDisplay.nav_lon_deg}
  - {from: NavigationState.altitude_ft, to: PlanningDisplay.nav_alt_m, transforms: [{unit: [ft, m]}]}
  - {from: NavigationState.heading, to: PlanningDisplay.nav_heading_deg, transforms: [{bam_decode: 16}]}
  - {from: NavigationState.groundspeed_kt, to: PlanningDisplay.nav_speed_kmh, transforms: [{unit: [kt, km/h]}]}

  # CueingProcessor: radians, label words, tight latency
  - {from: NavigationState.latitude, to: CueingProcessor.pos_lat_rad, transforms: [{unit: [deg, rad]}]}
  - {from: NavigationState.longitude, to: CueingProcessor.pos_lon_rad, transforms: [{unit: [deg, rad]}]}
  - {from: NavigationState.altitude_ft, to: CueingProcessor.pos_alt_m, transforms: [{unit: [ft, m]}]}
  - {from: AttitudeState.roll_deg, to: CueingProcessor.roll_rad, transforms: [{unit: [deg, rad]}]}
  - {from: AttitudeState.pitch_deg, to: CueingProcessor.pitch_rad, transforms: [{unit: [deg, rad]}]}
  - {from: AttitudeState.yaw_deg, to: CueingProcessor.yaw_rad, transforms: [{unit: [deg, rad]}]}
  - {from: AirData.baro_altitude_ft, to: CueingProcessor.baro_alt_m, transforms: [{unit: [ft, m]}]}

  # VoiceRelay: lowest latency budget; only the protocol differs, so values pass through
  - {from: TimeReference.utc_seconds, to: VoiceRelay.time_utc_s}
  - {from: PowerStatus.power_state, to: VoiceRelay.power_state}

  # StatusLogger: already speaks the baseline representation (G2: identity everywhere)
  - {from: NavigationState.altitude_ft, to: StatusLogger.altitude_ft}
  - {from: PowerStatus.bus_voltage_v, to: StatusLogger.bus_voltage_v}
  - {from: PowerStatus.power_state, to: StatusLogger.power_state}
  - {from: TimeReference.utc_seconds, to: StatusLogger.utc_seconds}

uplinks:
  - from: PlanningDisplay.show_page
    to: DisplayRequest
    fields:
      - from: page
        to: page_id
        transforms: [{enum: {map: {MAP: 1, STATUS: 2, CHECKLIST: 3}, to_encoding: uint8}}]
      - from: priority
        to: priority
        transforms: [{valid_range: [0, 3]}]
