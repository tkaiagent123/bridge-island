# Prepared, not activated: there is no remote yet.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/release_check.py
      - run: uv run pytest --cov --cov-report=term-missing
      - run: >-
          uv run coverage report --fail-under=90
          --include="src/bridge_island/core/*,src/bridge_island/bridge/*,src/bridge_island/codegen/*"
