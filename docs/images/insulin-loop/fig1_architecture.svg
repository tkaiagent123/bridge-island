<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" width="340" height="300" role="img" aria-labelledby="t d"><title id="t">Generic Glycemic Loop architecture (synthetic, illustrative)</title><desc id="d">The controller host (Baseline Island) connects only to the Bridge. The Bridge holds the OIU, Translator Module, UID, health and cyber monitors and the contract monitor. The Unique Island holds SensorA, SensorB, PumpA, PumpB v2 and the CompanionDisplay. The patient model, outside both islands, is sampled by the sensors and driven by the pumps.</desc>
<rect width="340" height="300" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<rect x="10" y="10" width="320" height="40" rx="6" fill="#E8E8E8" stroke="#444" stroke-width="1"/>
<text x="170" y="27" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#111">Baseline Island: Controller Host (immutable)</text>
<text x="170" y="41" text-anchor="middle" font-size="8" font-family="sans-serif" fill="#111">accepts GlucoseReading, DeliveryConfirmation, AlarmAck; publishes DoseCommand, ControllerStatus</text>
