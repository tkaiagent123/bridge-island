<text x="66" y="139" text-anchor="middle" font-size="8" font-family="sans-serif" fill="#111">health</text>
<rect x="126" y="124" width="88" height="22" rx="6" fill="#ffffff" stroke="#444" stroke-width="1"/>
<text x="170" y="139" text-anchor="middle" font-size="8" font-family="sans-serif" fill="#111">cyber</text>
